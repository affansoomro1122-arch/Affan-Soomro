<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You — Affan Soomro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="/images/faviicon.png" type="image/x-icon">
    <style>
      :root {
        --bg: #032628;
        --card: #0a3a3d;
        --line: rgba(255, 255, 255, 0.1);
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.66);
        --accent: #e8c83e;
        --ink: #070707;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--muted);
        font-family: "Inter", sans-serif;
        padding: 24px 16px;
        text-align: center;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(232, 200, 62, 0.1),
          transparent 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .box {
        position: relative;
        max-width: 560px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 56px 36px;
        animation: up 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
      }
      .check {
        width: 92px;
        height: 92px;
        margin: 0 auto 28px;
        border-radius: 50%;
        background: var(--accent);
        display: grid;
        place-items: center;
        box-shadow: 0 0 0 12px rgba(232, 200, 62, 0.15);
      }
      .check svg {
        width: 44px;
        height: 44px;
        stroke: var(--ink);
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        animation: draw 0.6s 0.4s forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      h1 {
        font-family: "Plus Jakarta Sans", sans-serif;
        color: var(--text);
        font-size: clamp(30px, 6vw, 44px);
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 14px;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        font-size: 17px;
        line-height: 1.7;
        margin-bottom: 34px;
      }
      .btns {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 700;
        text-decoration: none;
        padding: 14px 30px;
        border-radius: 6px;
        transition: 0.25s;
      }
      .primary {
        background: var(--accent);
        color: var(--ink);
        box-shadow: 4px 4px 0 #fff;
      }
      .primary:hover {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 #fff;
      }
      .ghost {
        border: 1px solid var(--line);
        color: var(--text);
      }
      .ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      small {
        display: block;
        margin-top: 26px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="check">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
      </div>
      <h1>Thank You<span id="who"></span>!</h1>
      <p>
        Your message has been sent successfully. I'll review your project
        details and get back to you within 24 hours.
      </p>
      <div class="btns">
        <a href="index.html" class="primary">Back to Home</a>
        <a href="index.html#projects" class="ghost">Recents Projects</a>
      </div>
      <small>Redirecting to the home page in <b id="sec">15</b>s…</small>
    </div>
    <script>
      try {
        const n = sessionStorage.getItem("contactName");
        if (n)
          document.getElementById("who").textContent = ", " + n.split(" ")[0];
      } catch (e) {}
      let t = 15;
      const el = document.getElementById("sec");
      setInterval(() => {
        t--;
        el.textContent = t;
        if (t <= 0) location.href = "index.html";
      }, 1000);
    </script>
  </body>
</html>
